<!-- plantilla.html -->
{% extends "base.html" %}

{% block content %}
<div class="c-form">
    <div class="container pt-5">
        <div class="row">
            {% if user_role == 'COORDINADOR' %}
                <div class="col">
                    <a class="c-btn c-btn-primary c-btn-block mb-3" href="{{ url_for('routes.menu_manager', user_id=user_id) }}">Menu</a>
                </div>
            {% elif user_role == 'VENDEDOR' %}
                <div class="col">
                    <a class="c-btn c-btn-primary c-btn-block mb-3" href="{{ url_for('routes.menu_salesman', user_id=user_id) }}">Menu</a>
                </div>
            {% endif %}
            <div class="col">
                <a class="c-btn c-btn-primary c-btn-block mb-3" href="./logout">Salir</a>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="c-users">
                    <p class="c-users__title">Registro de Transacciones</p>
                </div>
            </div>
        </div>
        <div class="row my-3">
            <div id="select-container" class="col">
                <div class="c-form__container c-form--mobile">
                    <h2 class="c-form__title">Registrar Transacción</h2>
                    
                    <form action="{{ url_for('routes.transactions') }}" method="POST" enctype="multipart/form-data" id="transactionForm">
                        <fieldset>
                            <legend>Tipo de Transacción</legend>
                            
                            <div class="c-form__group">
                                <label for="transactionType" class="c-form__label c-form__label--required">Tipo</label>
                                <select id="transactionType" 
                                        name="transaction_type" 
                                        class="c-form__select" 
                                        required>
                                    <option value="">Seleccione tipo de transacción</option>
                                    <option value="GASTO">Gasto</option>
                                    <option value="INGRESO">Ingreso</option>
                                    <option value="RETIRO">Retiro</option>
                                </select>
                            </div>
                            
                            <div class="c-form__group">
                                <label for="concept" class="c-form__label c-form__label--required">Concepto</label>
                                <select id="concept" 
                                        name="concept_id" 
                                        class="c-form__select" 
                                        required>
                                    <option value="">Seleccione un concepto</option>
                                    {% for concept in concepts %}
                                        <option value="{{ concept.id }}" data-transaction-type="{{ concept.transaction_types.value }}">{{ concept.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </fieldset>
                    <fieldset>
                        <div class="mb-3">
                            <legend for="description" style="color: #272727;" class="form-label">Descripción</legend>
                            <textarea class="c-form" style="width: 100%; min-height: 120px;" name="description" id="description" cols="30" rows="6" placeholder="Descripción detallada de la transacción..." required></textarea>
                        </div>
                    </fieldset>
                    <fieldset>
                        <div class="mb-3">
                            <legend style="color:#272727;">Valor</legend>
                            <input type="text" class="c-form c-form__input" id="quantity" name="quantity" placeholder="Monto" required>
                        </div>
                        <div class="mb-3">
                            <label for="photo" style="color:#272727;" class="form-label">Subir foto / comprobante:</label>
                            <input type="file" class="form-control" id="photo" accept="image/*" name="photo">
                            <div id="photoPreviewContainer" class="mt-2 text-center" style="display: none;">
                                <img id="photoPreview" src="" alt="Vista previa" style="max-height: 180px; max-width: 100%; border-radius: 8px; border: 1px solid #ced4da; object-fit: contain;">
                                <div id="photoStatus" class="small text-muted mt-1"></div>
                            </div>
                        </div>
                        
                        <button class="c-btn c-btn-primary mb-4" type="submit" id="submitButton">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</div>


<script>
    var isCompressing = false;

    // Prevenir múltiples envíos del formulario
    document.getElementById('transactionForm').addEventListener('submit', function(e) {
        var submitButton = document.getElementById('submitButton');
        
        if (isCompressing) {
            e.preventDefault();
            alert('Por favor espere a que termine de procesarse la imagen.');
            return false;
        }
        
        if (submitButton.disabled) {
            e.preventDefault();
            return false;
        }
        
        submitButton.disabled = true;
        submitButton.textContent = 'Enviando...';
    });
    
    // Obtener el tipo de transacción pasado desde el backend
    var transactionType = "{{ transaction_type }}";
    filterConceptOptions(transactionType);

    document.getElementById('transactionType').addEventListener('change', function() {
        filterConceptOptions(this.value);
    });

    document.getElementById('photo').addEventListener('change', function(event) {
        var file = event.target.files[0];
        var previewContainer = document.getElementById('photoPreviewContainer');
        var previewImg = document.getElementById('photoPreview');
        var statusText = document.getElementById('photoStatus');
        var submitBtn = document.getElementById('submitButton');

        if (!file) {
            previewContainer.style.display = 'none';
            previewImg.src = '';
            statusText.textContent = '';
            return;
        }

        // Mostrar vista previa inmediata
        try {
            previewImg.src = URL.createObjectURL(file);
            previewContainer.style.display = 'block';
            statusText.textContent = 'Archivo: ' + file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
        } catch(e) {
            console.warn('No se pudo generar vista previa:', e);
        }

        // Si no es imagen o es menor a 400KB, no requiere compresión adicional
        if (!file.type || !file.type.startsWith('image/') || file.size < 400 * 1024) {
            return;
        }

        isCompressing = true;
        statusText.textContent = 'Optimizando imagen...';
        if (submitBtn) submitBtn.disabled = true;

        compressAndConvertImage(file, function(compressedFile) {
            isCompressing = false;
            if (submitBtn) submitBtn.disabled = false;

            if (compressedFile) {
                try {
                    var dataTransfer = new DataTransfer();
                    dataTransfer.items.add(compressedFile);
                    document.getElementById('photo').files = dataTransfer.files;
                    statusText.textContent = 'Imagen optimizada: ' + Math.round(compressedFile.size / 1024) + ' KB';
                    previewImg.src = URL.createObjectURL(compressedFile);
                } catch(err) {
                    console.warn('DataTransfer no soportado, se usará el archivo original:', err);
                    statusText.textContent = 'Imagen lista (original): ' + Math.round(file.size / 1024) + ' KB';
                }
            } else {
                statusText.textContent = 'Imagen lista (original): ' + Math.round(file.size / 1024) + ' KB';
            }
        });
    });

    function compressAndConvertImage(file, callback) {
        try {
            const reader = new FileReader();
            reader.onerror = function() {
                callback(null);
            };
            reader.onload = function(event) {
                const img = new Image();
                img.onerror = function() {
                    callback(null);
                };
                img.onload = function() {
                    try {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");

                        const MAX_DIM = 1200;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_DIM || height > MAX_DIM) {
                            if (width > height) {
                                height = Math.round((height * MAX_DIM) / width);
                                width = MAX_DIM;
                            } else {
                                width = Math.round((width * MAX_DIM) / height);
                                height = MAX_DIM;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob(function(blob) {
                            if (!blob) {
                                callback(null);
                                return;
                            }
                            const newName = file.name.replace(/\.[^/.]+$/, "") + ".jpg";
                            const compressedFile = new File([blob], newName, {
                                type: "image/jpeg",
                                lastModified: Date.now()
                            });
                            callback(compressedFile);
                        }, "image/jpeg", 0.75);
                    } catch(err) {
                        console.error("Error durante compresión canvas:", err);
                        callback(null);
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        } catch(err) {
            console.error("Error al leer archivo:", err);
            callback(null);
        }
    }

    function filterConceptOptions(transactionType) {
        var conceptOptions = document.querySelectorAll('#concept option');
        conceptOptions.forEach(function(option) {
            var dataTransactionType = option.getAttribute('data-transaction-type');
            if (!transactionType || dataTransactionType === transactionType || option.value === '') {
                option.style.display = '';
            } else {
                option.style.display = 'none';
            }
        });
    }
</script>


{% endblock %}
